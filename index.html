<script>
(function(){
  var KEY="landed-gate-key",ITER=250000,enc=new TextEncoder();
  var raw=document.getElementById("d").textContent.trim();
  var D=Uint8Array.from(atob(raw),function(c){return c.charCodeAt(0)});
  var salt=D.slice(0,16),iv=D.slice(16,28),ct=D.slice(28);
  var m=document.getElementById("m"),err=document.getElementById("err");
  if(!window.crypto||!crypto.subtle||!window.DecompressionStream){m.hidden=false;err.textContent="This browser is too old or the page is not opened over https.";return}
  function b64(u){var s="";u.forEach(function(x){s+=String.fromCharCode(x)});return btoa(s)}
  function unb64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
  async function show(key){
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);
    var html=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    document.open();document.write(html);document.close();
  }
  async function fromPw(pw){
    var base=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
  }
  async function tryPw(pw){
    var k=await fromPw(pw);
    await show(k);                                   // throws if the password is wrong
    try{localStorage.setItem(KEY,b64(new Uint8Array(await crypto.subtle.exportKey("raw",k))))}catch(e){}
  }
  async function start(){
    var h=location.hash.match(/[#&]pw=([^&]*)/);
    if(h){
      var pw=decodeURIComponent(h[1]);
      try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
      try{await tryPw(pw);return}catch(e){}
    }
    var saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
    if(saved){
      try{await show(await crypto.subtle.importKey("raw",unb64(saved),"AES-GCM",false,["decrypt"]));return}
      catch(e){try{localStorage.removeItem(KEY)}catch(x){}}
    }
    m.hidden=false;
    var f=document.getElementById("f"),i=document.getElementById("pw"),b=document.getElementById("go");
    i.focus();
    f.addEventListener("submit",async function(ev){
      ev.preventDefault();if(!i.value)return;
      b.disabled=true;err.textContent="";
      try{await tryPw(i.value)}catch(e){err.textContent="Wrong password.";b.disabled=false;i.select()}
    });
  }
  start();
})();
</script>
